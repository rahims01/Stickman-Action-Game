<html lang="en">
<head>

  <title>Enemy Encyclopedia — Stickman Action</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0b1016;

      --surface2: #1c2128;
      --border: rgba(255,255,255,0.12);

      --text: #f0f0f0;

    }
    body { font-family: 'Rajdhani', 'Segoe UI', system-ui, sans-serif; background: radial-gradient(ellipse at 50% 0%, #14202b 0%, var(--bg) 55%, #06090c 100%); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Header */
    header { padding: 12px 24px; background: linear-gradient(160deg, rgba(16,20,26,0.9), rgba(8,10,14,0.85)); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; flex-shrink: 0; box-shadow: 0 4px 18px rgba(0,0,0,0.35); }
    header h1 { font-size: 21px; color: var(--accent); letter-spacing: 3px; text-shadow: 0 0 16px rgba(79,195,247,0.45); }
    header .subtitle { font-size: 12px; color: var(--muted); margin-top: 1px; letter-spacing: 1.5px; }
    .header-btn { padding: 7px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); font-family: inherit; font-size: 13px; font-weight: 600; letter-spacing: 1px; cursor: pointer; text-decoration: none; transition: filter 0.15s, transform 0.1s, box-shadow 0.15s; }
    .header-btn:hover { filter: brightness(1.35); box-shadow: 0 0 14px rgba(79,195,247,0.25); }
    .header-btn:active { transform: scale(0.96); }
    .search-box { margin-left: auto; padding: 8px 16px; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; color: var(--text); font-family: inherit; font-size: 13px; outline: none; width: 210px; transition: border-color 0.15s, box-shadow 0.15s; }
    .search-box:focus { border-color: var(--accent); box-shadow: 0 0 12px rgba(79,195,247,0.25); }

    /* Layout — every container is overflow:hidden so heights propagate down
       the flex chain. Only .info-panel scrolls (the text side), never any
       ancestor, so the viewer panel always has a measurable clientHeight. */
    .layout { display: flex; flex: 1; overflow: hidden; min-height: 0; }

    /* Sidebar */
    .sidebar { width: 220px; background: rgba(10,13,18,0.75); border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; padding: 8px 0; backdrop-filter: blur(4px); }
    .sidebar-section { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; padding: 14px 14px 6px; font-weight: 700; }
    .sidebar-section .count { opacity: 0.55; font-weight: 600; }
    .enemy-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 14px; background: none; border: none; color: var(--text); cursor: pointer; text-align: left; font-family: inherit; font-size: 14px; font-weight: 500; border-left: 3px solid transparent; transition: background 0.12s, padding-left 0.12s; }
    .enemy-btn:hover { background: rgba(255,255,255,0.05); padding-left: 17px; }
    .enemy-btn.active { background: rgba(79,195,247,0.1); border-left-color: var(--accent); color: var(--accent); }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 6px currentColor; }

    /* Main content */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
    .content { display: flex; flex: 1; min-height: 0; overflow: hidden; }
    .viewer-panel { width: 340px; flex-shrink: 0; background: radial-gradient(ellipse at 50% 35%, #17222d 0%, #0b1016 75%); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    #viewer-canvas { width: 100%; flex: 1; display: block; min-height: 0; }
    .viewer-controls-hint { flex-shrink: 0; padding: 8px 10px; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); background: rgba(8,10,14,0.6); }
    .viewer-controls-hint label { display: flex; align-items: center; gap: 5px; cursor: pointer; color: var(--muted); white-space: nowrap; }
    .info-panel { flex: 1; padding: 28px 32px; overflow-y: auto; }
    .info-panel.fade-in { animation: fade-in 0.3s ease-out; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .enemy-name { font-size: 30px; font-weight: 700; margin-bottom: 6px; letter-spacing: 1px; text-shadow: 0 0 22px currentColor; }
    .enemy-type-badge { display: inline-block; padding: 3px 12px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin: 0 6px 18px 0; }
    .badge-basic { background: rgba(139,195,74,0.16); color: #aed581; border: 1px solid rgba(139,195,74,0.35); }
    .badge-special { background: rgba(239,83,80,0.16); color: #ef9a9a; border: 1px solid rgba(239,83,80,0.35); }
    .badge-rare { background: rgba(255,167,38,0.16); color: #ffcc80; border: 1px solid rgba(255,167,38,0.35); }
    .badge-clear { background: rgba(208,238,255,0.1); color: #d0eeff; border: 1px solid rgba(208,238,255,0.3); }
    .badge-arena { background: rgba(255,138,101,0.14); color: #ff8a65; border: 1px solid rgba(255,138,101,0.35); }
    .badge-neutral { background: rgba(197,225,165,0.12); color: #c5e1a5; border: 1px solid rgba(197,225,165,0.3); }
    .badge-spawn { background: rgba(79,195,247,0.12); color: #90d8fa; border: 1px solid rgba(79,195,247,0.3); }

    /* Stats */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 22px; }
    .stat-card { background: linear-gradient(165deg, var(--surface2), #14181e); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s; }
    .stat-card:hover { transform: translateY(-2px); border-color: rgba(79,195,247,0.4); box-shadow: 0 6px 18px rgba(0,0,0,0.35); }
    .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 4px; font-weight: 700; }
    .stat-value { font-size: 22px; font-weight: 700; }
    .stat-bar { height: 5px; border-radius: 3px; margin-top: 7px; background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.06); overflow: hidden; }
    .stat-fill { height: 100%; border-radius: 2px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.3); }

    /* Abilities */
    h3 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 6px; font-weight: 700; }
    .abilities { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
    .ability-tag { padding: 5px 12px; border-radius: 7px; font-size: 13px; font-weight: 600; border: 1px solid; }
    .description { font-size: 15px; line-height: 1.7; color: #ccc; margin-bottom: 22px; }
    .tips-list { list-style: none; }
    .tips-list li { font-size: 14px; color: #bbb; padding: 7px 0 7px 20px; position: relative; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .tips-list li::before { content: '▸'; position: absolute; left: 0; color: var(--accent); }
    .tips-list li:last-child { border-bottom: none; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.04); }
    ::-webkit-scrollbar-thumb { background: rgba(79,195,247,0.3); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(79,195,247,0.5); }
  </style>
</head>

// OrbitControls equivalent (manual implementation, no external dependency)
let isDragging = false, isRightDrag = false;
let prevMouse = { x: 0, y: 0 };
let theta = 0, phi = Math.PI / 6, radius = 3.5;
let target = new THREE.Vector3(0, 0.9, 0);

canvas.addEventListener('mousedown', (e) => {
  isDragging = true;
  isRightDrag = e.button === 2;
  prevMouse = { x: e.clientX, y: e.clientY };
});
window.addEventListener('mouseup', () => isDragging = false);
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - prevMouse.x;
  const dy = e.clientY - prevMouse.y;
  prevMouse = { x: e.clientX, y: e.clientY };
  if (isRightDrag) {
    target.x -= dx * 0.01;
    target.y += dy * 0.01;
  } else {
    theta -= dx * 0.008;
    phi = Math.max(0.05, Math.min(Math.PI / 2, phi - dy * 0.008));
  }
});
canvas.addEventListener('wheel', (e) => {
  radius = Math.max(1.2, Math.min(8, radius + e.deltaY * 0.005));
});

function updateCamera() {
  const x = target.x + radius * Math.sin(theta) * Math.cos(phi);
  const y = target.y + radius * Math.sin(phi);
  const z = target.z + radius * Math.cos(theta) * Math.cos(phi);
  camera.position.set(x, y, z);
  camera.lookAt(target);
}

// ── Bone-morph engine (port of src/world/characterMorph.ts) ─────────────
// Applies the same sliders the game uses so rare variants look identical
// to their in-game counterparts. Called on a fresh SkeletonUtils clone
// whose bones are still in their original bind-pose, so there is no need
// to cache originals — we read the current values as "original" directly.
function applyBodySliders(model, sliders) {
  const bone = name => { let b = null; model.traverse(c => { if (c.name === name) b = c; }); return b; };
  const SPINE  = ['mixamorigSpine','mixamorigSpine1','mixamorigSpine2'];
  const LEG_U  = ['mixamorigLeftUpLeg','mixamorigRightUpLeg'];
  const LEG_L  = ['mixamorigLeftLeg','mixamorigRightLeg'];
  const ARM_U  = ['mixamorigLeftArm','mixamorigRightArm'];

  if (sliders.height != null) {
    const s = sliders.height;
    model.updateMatrixWorld(true);
    const foot = bone('mixamorigLeftFoot');
    const beforeY = foot ? foot.getWorldPosition(new THREE.Vector3()).y : 0;
    [...LEG_U, ...LEG_L, ...SPINE].forEach(n => { const b = bone(n); if (b) b.scale.y *= s; });
    const neck = bone('mixamorigNeck');
    if (neck) neck.scale.y *= 1 + (s - 1) * 0.3;
    if (foot) {
      model.updateMatrixWorld(true);
      const afterY = foot.getWorldPosition(new THREE.Vector3()).y;
      const hips = bone('mixamorigHips');
      if (hips) hips.position.y += beforeY - afterY;
    }
  }

  if (sliders.weight != null) {
    const w = sliders.weight;
    const tF = 1 + w * 0.35, aF = 1 + w * 0.15;
    ['mixamorigHips', ...SPINE, ...LEG_U].forEach(n => { const b = bone(n); if (b) { b.scale.x *= tF; b.scale.z *= tF; } });
    ARM_U.forEach(n => { const b = bone(n); if (b) { b.scale.x *= aF; b.scale.z *= aF; } });
  }

  // Direct per-bone overrides — applied BEFORE headSize so headSize can
  // measure the correct inherited scale after all structural morphs.
  // Each entry is [sx, sy, sz] multiplied onto the bone's current local scale.
  if (sliders.boneOverrides) {
    for (const [name, [sx, sy, sz]] of Object.entries(sliders.boneOverrides)) {
      const b = bone(name);
      if (b) b.scale.set(b.scale.x * sx, b.scale.y * sy, b.scale.z * sz);
    }
  }

  if (sliders.headSize != null) {
    // Mirror characterMorph.ts: measure inherited scale in model-relative
    // space (not world) to cancel ancestor distortions from all other morphs.
    model.updateMatrixWorld(true);
    const head = bone('mixamorigHead');
    if (head) {
      const relMat = model.matrixWorld.clone().invert().multiply(head.matrixWorld);
      const iS = new THREE.Vector3();
      relMat.decompose(new THREE.Vector3(), new THREE.Quaternion(), iS);
      const ts = sliders.headSize;
      head.scale.set(head.scale.x * (ts / iS.x), head.scale.y * (ts / iS.y), head.scale.z * (ts / iS.z));
    }
  }
}

// ── Ambient particle system ──────────────────────────────────────────────
// style: 'orbs' (rising), 'sparks' (fast upward), 'snow' (falling)
class SpecialParticles {
  constructor(color, modelHeight, style = 'orbs') {
    this.style = style;
    const COUNT = style === 'sparks' ? 36 : 28;
    const pos   = new Float32Array(COUNT * 3);
    const vel   = new Float32Array(COUNT * 3);
    const life  = new Float32Array(COUNT);
    for (let i = 0; i < COUNT; i++) this._resetParticle(pos, vel, life, i, modelHeight, true);
    this.pos = pos; this.vel = vel; this.life = life;
    this.count = COUNT; this.modelH = modelHeight;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const ptSize = style === 'snow' ? 0.045 : style === 'sparks' ? 0.04 : 0.055;
    const mat = new THREE.PointsMaterial({
      color: new THREE.Color(color), size: ptSize,
      blending: THREE.AdditiveBlending, transparent: true,
      opacity: 0.85, depthWrite: false, sizeAttenuation: true
    });
    this.points = new THREE.Points(geo, mat);
    this.geo = geo;
    this.light = new THREE.PointLight(new THREE.Color(color), 0.6, 3.5);
    this.light.position.set(0, modelHeight * 0.5, 0.4);
  }
  _resetParticle(pos, vel, life, i, h, scatter) {
    const ang = Math.random() * Math.PI * 2;
    const r   = this.style === 'sparks' ? 0.1 + Math.random() * 0.7 : 0.2 + Math.random() * 0.55;
    pos[i*3]   = Math.cos(ang) * r;
    pos[i*3+2] = Math.sin(ang) * r;
    if (this.style === 'snow') {
      pos[i*3+1] = scatter ? Math.random() * h : h + 0.15;
      vel[i*3]   = (Math.random() - 0.5) * 0.08;
      vel[i*3+1] = -(0.28 + Math.random() * 0.28);
      vel[i*3+2] = (Math.random() - 0.5) * 0.08;
    } else if (this.style === 'sparks') {
      pos[i*3+1] = scatter ? Math.random() * h : 0.05;
      vel[i*3]   = (Math.random() - 0.5) * 0.5;
      vel[i*3+1] = 0.8 + Math.random() * 1.0;
      vel[i*3+2] = (Math.random() - 0.5) * 0.5;
    } else {
      pos[i*3+1] = scatter ? Math.random() * h : 0.05;
      vel[i*3]   = (Math.random() - 0.5) * 0.15;
      vel[i*3+1] = 0.35 + Math.random() * 0.45;
      vel[i*3+2] = (Math.random() - 0.5) * 0.15;
    }
    life[i] = 0.7 + Math.random() * 0.3;
  }
  update(dt) {
    const { pos, vel, life, count, modelH } = this;
    for (let i = 0; i < count; i++) {
      pos[i*3]   += vel[i*3]   * dt;
      pos[i*3+1] += vel[i*3+1] * dt;
      pos[i*3+2] += vel[i*3+2] * dt;
      life[i]    -= dt / (1.5 + Math.random() * 0.5);
      const done = this.style === 'snow' ? pos[i*3+1] < -0.3 : pos[i*3+1] > modelH + 0.4;
      if (life[i] <= 0 || done) this._resetParticle(pos, vel, life, i, modelH, false);
    }
    this.geo.attributes.position.needsUpdate = true;
    this.light.intensity = 0.45 + Math.sin(Date.now() * 0.003) * 0.2;
  }
  dispose() { this.geo.dispose(); this.points.material.dispose(); }
}

const procTexCache = new Map();
function getProceduralTexture(key) {
  if (procTexCache.has(key)) return procTexCache.get(key);
  const entry = MATERIAL_PALETTE[key];
  if (!entry) return null;
  const [base, speckle] = entry;
  const SZ = 256;
  const cv = document.createElement('canvas');
  cv.width = SZ; cv.height = SZ;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = base; ctx.fillRect(0, 0, SZ, SZ);
  let seed = 0;
  for (let i = 0; i < key.length; i++) seed = (seed * 31 + key.charCodeAt(i)) >>> 0;
  const rand = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  for (let i = 0; i < 1800; i++) {
    ctx.fillStyle = speckle[Math.floor(rand() * speckle.length)];
    ctx.beginPath();
    ctx.arc(rand() * SZ, rand() * SZ, 0.6 + rand() * 2.2, 0, Math.PI * 2);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  procTexCache.set(key, tex);
  return tex;
}



const skinTextureCache = new Map();
const textureLoader = new THREE.TextureLoader();
function getSkinTexture(url) {
  let tex = skinTextureCache.get(url);

    tex = textureLoader.load(url);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    skinTextureCache.set(url, tex);
  }
  return tex;
}

// ── Idle animation ──────────────────────────────────────────────────────
// Strip ALL hips position motion so the animation can never drift the
// model off the ground. Locking X/Z only (as the game does) still lets
// Y-bob float the model above the grid in a static 3D viewer; locking Y
// too keeps feet planted while all other bones still animate freely.
function stripRootMotion(clip) {
  const track = clip.tracks.find(t => t.name === 'mixamorigHips.position');
  if (!track) return;
  const v = track.values;
  const bx = v[0], by = v[1], bz = v[2];
  for (let i = 0; i < v.length; i += 3) { v[i] = bx; v[i+1] = by; v[i+2] = bz; }
}

let idleClip    = null;   // shared, loaded once

function attachIdleAnimation(model) {

  if (!idleClip || !model) return;
  const mixer = new THREE.AnimationMixer(model);
  const action = mixer.clipAction(idleClip);
  action.play();
  currentMixer = mixer;
}

function showEnemy(enemy) {
  // Tear down previous model, mixer, particles, and medic cross.
  if (currentMixer) { currentMixer.stopAllAction(); currentMixer = null; }
  if (currentModel) { scene.remove(currentModel); currentModel = null; }
  if (particles) { scene.remove(particles.points); scene.remove(particles.light); particles.dispose(); particles = null; }
  if (medicCrossSprite) {
    medicCrossSprite.parent && medicCrossSprite.parent.remove(medicCrossSprite);
    medicCrossSprite.material.map && medicCrossSprite.material.map.dispose();
    medicCrossSprite.material.dispose();
    medicCrossSprite = null;
  }
  // Sentry turret: the in-game primitive build (base drum + head + barrel).
  if (enemy.isTurret) {
    const turret = new THREE.Group();
    const base = new THREE.Mesh(
      new THREE.CylinderGeometry(0.28, 0.34, 0.3, 10),
      new THREE.MeshStandardMaterial({ color: '#37474f', metalness: 0.6, roughness: 0.4 })
    );
    base.position.y = 0.15;
    const head = new THREE.Mesh(
      new THREE.BoxGeometry(0.3, 0.24, 0.3),
      new THREE.MeshStandardMaterial({ color: enemy.color, emissive: enemy.color, emissiveIntensity: 0.5, metalness: 0.5, roughness: 0.35 })
    );
    head.position.y = 0.45;
    const barrel = new THREE.Mesh(
      new THREE.CylinderGeometry(0.045, 0.045, 0.3, 8),
      new THREE.MeshStandardMaterial({ color: '#263238', metalness: 0.7, roughness: 0.3 })
    );
    barrel.rotation.x = Math.PI / 2;
    barrel.position.set(0, 0.45, 0.26);
    turret.add(base, head, barrel);
    turret.traverse(o => { if (o.isMesh) o.castShadow = true; });
    scene.add(turret);
    currentModel = turret;
    target.set(0, 0.42, 0);
    radius = 2.2;
    return;
  }

  // Cube/ball enemies: simple primitives, no skeleton. Cubes get their
  // in-game googly eyes on the front face.
  if (enemy.isCube || enemy.isBall) {
    const shapeGroup = new THREE.Group();
    const body = new THREE.Mesh(
      enemy.isBall ? new THREE.SphereGeometry(0.42, 20, 16) : new THREE.BoxGeometry(0.7, 0.7, 0.7),
      new THREE.MeshStandardMaterial({ color: enemy.color, emissive: enemy.color, emissiveIntensity: 0.35, roughness: 0.5, metalness: enemy.isBall ? 0.3 : 0 })
    );
    body.position.y = enemy.isBall ? 0.42 : 0.38;
    body.castShadow = true;
    shapeGroup.add(body);
    if (enemy.isCube) {
      [-1, 1].forEach(side => {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.077, 10, 8), new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.3 }));
        eye.position.set(0.133 * side, 0.098, 0.365);
        const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 6), new THREE.MeshStandardMaterial({ color: '#111111' }));
        pupil.position.z = 0.049;
        eye.add(pupil);
        body.add(eye);
      });
    }
    // The Slime King's golden crown (band + four spikes on the top face).
    if (enemy.isSlimeKing) {
      const gold = () => new THREE.MeshStandardMaterial({ color: '#ffd54f', metalness: 0.75, roughness: 0.25, emissive: '#ffb300', emissiveIntensity: 0.25 });
      const band = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.19, 0.09, 10), gold());
      band.position.y = 0.4;
      body.add(band);
      for (let i = 0; i < 4; i++) {
        const a = (i / 4) * Math.PI * 2;
        const spike = new THREE.Mesh(new THREE.ConeGeometry(0.035, 0.11, 6), gold());
        spike.position.set(Math.cos(a) * 0.13, 0.49, Math.sin(a) * 0.13);
        body.add(spike);

    currentModel = shapeGroup;
    target.set(0, 0.5, 0);
    radius = 2.6;
    const shapeParticleCfg = PARTICLE_STYLE_MAP[enemy.id];
    if (shapeParticleCfg) {
      particles = new SpecialParticles(shapeParticleCfg.color, 0.9, shapeParticleCfg.style);
      scene.add(particles.points);
      scene.add(particles.light);

  // bone references broken and the skinned mesh collapses to a point.

  const bodyScale  = enemy.bodyScale ?? 1;

        c.roughness = 0.04;
        c.metalness = 0.15;

      } else if (enemy.skinMaterial) {
        // Room families: procedural surface, white base so it shows untinted.
        const pt = getProceduralTexture(enemy.skinMaterial);
        if (pt) { c.map = pt; c.color.set('#ffffff'); c.needsUpdate = true; }
        else c.color.set(enemy.color);

  const halfTan = Math.tan(fovRad / 2);

  const particleCfg = PARTICLE_STYLE_MAP[enemy.id] || PARTICLE_STYLE_MAP[enemy.id.replace(/Clear$/, '')];
  if (particleCfg) {
    particles = new SpecialParticles(particleCfg.color, h, particleCfg.style);

    scene.add(particles.light);
  }

  if (enemy.id === 'medicMan') {
    const cs = 64;
    const cc = document.createElement('canvas');
    cc.width = cc.height = cs;
    const cx = cc.getContext('2d');

    cx.lineTo(0,cr); cx.quadraticCurveTo(0,0,cr,0);

    medicCrossSprite = new THREE.Sprite(smat);

function resizeViewer() {
  const panel = canvas.parentElement;
  if (!panel) return;
  const hintBar = panel.querySelector('.viewer-controls-hint');
  const hintH = hintBar ? hintBar.offsetHeight : 28;
  const w = panel.clientWidth;
  const h = panel.clientHeight - hintH;
  if (w <= 0 || h <= 0) { requestAnimationFrame(resizeViewer); return; }
  renderer.setSize(w, h, false);
  canvas.style.height = h + 'px';
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

let animFrame;
let lastT = 0;
let autoRotate = true;
document.getElementById('auto-rotate').addEventListener('change', function () { autoRotate = this.checked; });
function animate(t) {
  animFrame = requestAnimationFrame(animate);
  // Clamp AND NaN-guard dt: the first frame has no previous timestamp, and a
  // NaN here would poison theta/rotations/mixer state permanently.
  const dt = Math.min(Math.max((t - lastT) / 1000, 0), 0.1) || 0;
  lastT = t;
  loadingMesh.rotation.y += dt * 1.5;
  if (autoRotate && !isDragging) theta += dt * 0.35;
  if (currentMixer) currentMixer.update(dt);
  if (particles) particles.update(dt);
  updateCamera();
  renderer.render(scene, camera);
}
// Start via rAF so the first invocation receives a real timestamp.

  const sorted = [...list].sort((a, b) => tierOrder.indexOf(a.tier) - tierOrder.indexOf(b.tier));

    if (enemy.tier !== lastTier) {
      lastTier = enemy.tier;

      sec.style.color = tierColor(enemy.tier);

    btn.innerHTML = `<span class="dot" style="background:${enemy.color};color:${enemy.color}"></span>${enemy.label}`;

    btn.style.display = match ? '' : 'none';
  });
  const sections = document.querySelectorAll('.sidebar-section');
  sections.forEach(sec => {
    let next = sec.nextElementSibling;

    while (next && !next.classList.contains('sidebar-section')) {
      if (next.style.display !== 'none') anyVisible = true;
      next = next.nextElementSibling;
    }
    sec.style.display = anyVisible ? '' : 'none';

});

// Keyboard: up/down arrows step through the (currently visible) roster,
// '/' focuses the search box.
window.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== document.getElementById('search')) {
    e.preventDefault();
    document.getElementById('search').focus();
    return;
  }
  if (document.activeElement === document.getElementById('search') && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    document.activeElement.blur();
  }
  if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  if (document.activeElement && document.activeElement.tagName === 'INPUT' && document.activeElement.type === 'text') return;
  e.preventDefault();
  const visible = sortedEnemies.filter(en => {
    const btn = document.querySelector(`.enemy-btn[data-id="${en.id}"]`);
    return btn && btn.style.display !== 'none';
  });
  if (visible.length === 0) return;
  const idx = visible.indexOf(selectedEnemy);
  const next = e.key === 'ArrowDown'
    ? visible[(idx + 1 + visible.length) % visible.length]
    : visible[(idx - 1 + visible.length) % visible.length];
  selectEnemy(next);
});

// Init
buildSidebar(ENEMIES);
selectEnemy(ENEMIES[0]);

// Debug handle (harmless in production, invaluable when the viewer misbehaves).
window.__ency = { scene, renderer, camera, get model() { return currentModel; } };
  </script>
</body>
