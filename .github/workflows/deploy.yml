name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 8 wants a modern Node; 22 is the current LTS.
          node-version: 22
          cache: npm

      - run: npm ci

      # tsc is the real correctness gate for this project - there is no
      # working eslint - so a type error must fail the deploy, not ship.
      - run: npm run build

      - run: npm test

      - name: Check for Cloudflare credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Cloudflare secrets set - skipping deploy. Either add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, or let Cloudflare's Git integration deploy the repo instead."
          fi

      # `deploy`, not `pages deploy`: wrangler.toml is a Workers Static Assets
      # config. The two are not interchangeable - see the notes in that file.
      # wrangler.toml's own [build] hook re-runs the build here, which is
      # cheap and guarantees the uploaded dist matches this commit.
      - name: Deploy to Cloudflare Workers
        if: steps.creds.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
